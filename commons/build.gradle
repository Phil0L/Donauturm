plugins {
    id 'com.android.library'
}

android {
    namespace 'com.pl.donauturm.commons'
    compileSdk project.targetSdkVersion as int

    defaultConfig {
        minSdkVersion project.minSdkVersion as int
        targetSdkVersion project.targetSdkVersion as int
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(project.java_verison as int)
        targetCompatibility JavaVersion.toVersion(project.java_verison as int)
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    // defaults
    api 'com.google.android.material:material:1.8.0'
    api 'androidx.appcompat:appcompat:1.6.1'
    api "androidx.constraintlayout:constraintlayout:2.1.4"
    api "androidx.recyclerview:recyclerview:1.3.0"
    api "androidx.lifecycle:lifecycle-livedata-ktx:2.6.0"
    api "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.0"
    api "androidx.navigation:navigation-fragment:2.5.3"
    api "androidx.navigation:navigation-ui:2.5.3"
    api 'androidx.navigation:navigation-runtime:2.5.3'
    api "androidx.legacy:legacy-support-v4:1.0.0"
    api 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    api 'androidx.preference:preference:1.2.0'

    // utils
    api 'com.google.code.gson:gson:2.10.1'
    api "com.ncorti:slidetoact:0.10.0"
    api 'com.squareup.okhttp3:okhttp:4.10.0'

    // tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test:rules:1.0.2'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }


}