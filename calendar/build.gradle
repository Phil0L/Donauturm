plugins {
    id 'com.android.library'
}

android {
    namespace 'com.pl.donauturm.calendar'
    compileSdk project.targetSdkVersion as int

    defaultConfig {
        minSdkVersion project.minSdkVersion as int
        targetSdkVersion project.targetSdkVersion as int
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(project.java_verison as int)
        targetCompatibility JavaVersion.toVersion(project.java_verison as int)
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(path: ':commons')

    implementation 'org.mnode.ical4j:ical4j:3.2.8'
    implementation 'org.ocpsoft.prettytime:prettytime:5.0.4.Final'
}