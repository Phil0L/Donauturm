plugins {
    id 'com.android.library'
}

android {
    namespace 'com.pl.donauturm.spotify'
    compileSdk project.targetSdkVersion as int

    defaultConfig {
        minSdkVersion project.minSdkVersion as int
        targetSdkVersion project.targetSdkVersion as int
        useLibrary 'org.apache.http.legacy'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        manifestPlaceholders = [redirectSchemeName: "https", redirectHostName: "spotify_donauturm_pl.com/auth"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(project.java_verison as int)
        targetCompatibility JavaVersion.toVersion(project.java_verison as int)
    }

    buildFeatures {
        viewBinding true
    }
}
dependencies {
    implementation project(path: ':commons')

    implementation 'com.h6ah4i.android.widget.verticalseekbar:verticalseekbar:1.0.0'
    implementation "com.spotify.android:auth:2.0.2"
    implementation "net.sourceforge.htmlunit:htmlunit:2.14"
    implementation 'se.michaelthelin.spotify:spotify-web-api-java:7.3.0'
    implementation fileTree(dir: 'libs', include: ['*.aar'])

}

