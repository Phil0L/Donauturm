plugins {
    id 'com.android.library'
}

android {
    namespace 'com.pl.donauturm.drinksmenu'
    compileSdk project.targetSdkVersion as int

    defaultConfig {
        minSdkVersion project.minSdkVersion as int
        targetSdkVersion project.targetSdkVersion as int
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(project.java_verison as int)
        targetCompatibility JavaVersion.toVersion(project.java_verison as int)
    }

    buildFeatures {
        viewBinding true
    }

}

dependencies {

    implementation project(path: ':commons')
//    implementation project(path: ':fonts') // TODO: uncomment! commented for faster build time
    implementation project(path: ':pisignageapi')

    implementation 'com.github.martin-stone:hsv-alpha-color-picker-android:3.0.1'
    implementation "com.github.skydoves:expandablelayout:1.0.6"
    implementation "com.github.ChiliLabs:ChiliPhotoPicker:0.3.1"
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'

}