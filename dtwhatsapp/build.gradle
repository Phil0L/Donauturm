plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pl.donauturm.dtwhatsapp'
    compileSdk project.targetSdkVersion as int

    defaultConfig {
        applicationId "com.pl.donauturm.dtwhatsapp"
        minSdkVersion project.minSdkVersion as int
        targetSdkVersion project.targetSdkVersion as int
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.toVersion(project.java_verison as int)
        targetCompatibility JavaVersion.toVersion(project.java_verison as int)
    }

    sourceSets {
        main {
            assets {
                srcDirs 'src\\main\\js'
            }
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(path: ':commons')

    implementation 'androidx.webkit:webkit:1.6.0'
}