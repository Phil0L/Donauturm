plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_verison as int)
    targetCompatibility = JavaVersion.toVersion(project.java_verison as int)
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
}