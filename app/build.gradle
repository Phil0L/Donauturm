plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pl.donauturm'
    compileSdk project.targetSdkVersion as int

    defaultConfig {
        applicationId "com.pl.donauturm"
        minSdkVersion project.minSdkVersion as int
        targetSdkVersion project.targetSdkVersion as int
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [redirectSchemeName: "spotify", redirectHostName: "auth"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['**']
        }
        resources {
            pickFirsts += ['**']
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.toVersion(project.java_verison as int)
        targetCompatibility JavaVersion.toVersion(project.java_verison as int)
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}


dependencies {

    // modules:
    implementation project(path: ':commons')
    implementation project(path: ':drinksmenu')
    implementation project(path: ':calendar')
    implementation project(path: ':spotify')
    implementation project(path: ':bingo')
    implementation project(path: ':checklist')

    // test dependencies:
    androidTestImplementation project(path: ':pisignageapi')

    // feature dependencies:
    implementation 'org.mnode.ical4j:ical4j:3.2.8'
    implementation "com.github.ChiliLabs:ChiliPhotoPicker:0.3.1"
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
}